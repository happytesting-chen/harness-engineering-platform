<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d">
  <title id="t">Harness architecture: control plane with three gates, data plane content boundary, and a planned sub-agent layer</title>
  <desc id="d">A tool call proposed by the Claude Code session passes through the PreToolUse hook, then Gate 1 (deny-list), Gate 2 (phase-gate) and Gate 3 (egress, Bash only) in series. Any gate can exit 2 and block the call. If all pass, the tool executes and PostToolUse appends to audit.log. Separately, untrusted input passes through content_trust.py before reaching agent context. A dashed lane at the bottom shows a planned, not-yet-implemented sub-agent layer.</desc>

  <rect width="1100" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="arwGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h  { font-size: 16px; font-weight: 700; }
    .sh { font-size: 12px; font-weight: 700; fill: #57606a; letter-spacing: .06em; }
    .b  { font-size: 12.5px; font-weight: 700; }
    .s  { font-size: 11px; fill: #57606a; }
    .m  { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .lbl{ font-size: 10.5px; fill: #57606a; }
    .box  { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .gate { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .pol  { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
    .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
    .good { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.6; }
    .plan { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .data { stroke: #9a6700; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
    .kill { stroke: #cf222e; stroke-width: 1.6; fill: none; }
  </style>

  <text class="h" x="20" y="28">Control plane — every tool call is checked at the tool boundary, not in the prompt</text>

  <!-- policy band -->
  <text class="sh" x="20" y="97">POLICY</text>
  <text class="sh" x="20" y="112">(data)</text>
  <rect class="pol" x="390" y="70" width="130" height="44" rx="4"/>
  <text class="m" x="455" y="88" text-anchor="middle">deny-list.json</text>
  <text class="lbl" x="455" y="103" text-anchor="middle">blocked patterns</text>

  <rect class="pol" x="545" y="70" width="160" height="44" rx="4"/>
  <text class="m" x="625" y="88" text-anchor="middle">feature_list.json</text>
  <text class="m" x="625" y="103" text-anchor="middle">mcp-allowlist.json</text>

  <rect class="pol" x="730" y="70" width="130" height="44" rx="4"/>
  <text class="m" x="795" y="88" text-anchor="middle">egress_hosts</text>
  <text class="lbl" x="795" y="103" text-anchor="middle">(allowlist)</text>

  <line class="data" x1="455" y1="114" x2="455" y2="146" marker-end="url(#arw)"/>
  <line class="data" x1="625" y1="114" x2="625" y2="146" marker-end="url(#arw)"/>
  <line class="data" x1="795" y1="114" x2="795" y2="146" marker-end="url(#arw)"/>

  <!-- main pipeline -->
  <rect class="box" x="20" y="150" width="140" height="64" rx="4"/>
  <text class="b" x="90" y="176" text-anchor="middle">Claude Code</text>
  <text class="s" x="90" y="192" text-anchor="middle">proposes a</text>
  <text class="s" x="90" y="205" text-anchor="middle">tool call</text>

  <rect class="box" x="200" y="150" width="150" height="64" rx="4"/>
  <text class="b" x="275" y="174" text-anchor="middle">PreToolUse hook</text>
  <text class="m" x="275" y="190" text-anchor="middle">Bash|Write|Edit|</text>
  <text class="m" x="275" y="203" text-anchor="middle">MultiEdit|NotebookEdit</text>

  <rect class="gate" x="390" y="150" width="130" height="64" rx="4"/>
  <text class="b" x="455" y="174" text-anchor="middle">Gate 1</text>
  <text class="s" x="455" y="190" text-anchor="middle">deny-list</text>
  <text class="lbl" x="455" y="205" text-anchor="middle">command strings</text>

  <rect class="gate" x="560" y="150" width="130" height="64" rx="4"/>
  <text class="b" x="625" y="174" text-anchor="middle">Gate 2</text>
  <text class="s" x="625" y="190" text-anchor="middle">phase-gate</text>
  <text class="lbl" x="625" y="205" text-anchor="middle">all 5 gated tools</text>

  <rect class="gate" x="730" y="150" width="130" height="64" rx="4"/>
  <text class="b" x="795" y="174" text-anchor="middle">Gate 3</text>
  <text class="s" x="795" y="190" text-anchor="middle">egress</text>
  <text class="lbl" x="795" y="205" text-anchor="middle">Bash only</text>

  <rect class="good" x="900" y="150" width="140" height="64" rx="4"/>
  <text class="b" x="970" y="174" text-anchor="middle">exit 0 — allow</text>
  <text class="s" x="970" y="190" text-anchor="middle">the tool</text>
  <text class="s" x="970" y="203" text-anchor="middle">actually runs</text>

  <line class="flow" x1="160" y1="182" x2="196" y2="182" marker-end="url(#arw)"/>
  <line class="flow" x1="350" y1="182" x2="386" y2="182" marker-end="url(#arw)"/>
  <line class="flow" x1="520" y1="182" x2="556" y2="182" marker-end="url(#arw)"/>
  <line class="flow" x1="690" y1="182" x2="726" y2="182" marker-end="url(#arw)"/>
  <line class="flow" x1="860" y1="182" x2="896" y2="182" marker-end="url(#arw)"/>

  <!-- second band -->
  <rect class="box" x="180" y="252" width="190" height="56" rx="4"/>
  <text class="m" x="275" y="274" text-anchor="middle">Security-kit/secret_scan.py</text>
  <text class="lbl" x="275" y="292" text-anchor="middle">second PreToolUse hook</text>
  <line class="flow" x1="275" y1="214" x2="275" y2="248" marker-end="url(#arw)"/>

  <rect class="bad" x="380" y="252" width="460" height="56" rx="4"/>
  <text class="b" x="610" y="274" text-anchor="middle">exit 2 — BLOCKED · first denial wins · the call never executes</text>
  <text class="s" x="610" y="292" text-anchor="middle">fails closed on empty or malformed input — limits and one documented exception in the README</text>
  <line class="kill" x1="455" y1="214" x2="455" y2="248" marker-end="url(#arwRed)"/>
  <line class="kill" x1="625" y1="214" x2="625" y2="248" marker-end="url(#arwRed)"/>
  <line class="kill" x1="795" y1="214" x2="795" y2="248" marker-end="url(#arwRed)"/>

  <rect class="box" x="860" y="252" width="220" height="56" rx="4"/>
  <text class="b" x="970" y="273" text-anchor="middle">PostToolUse — every tool</text>
  <text class="m" x="970" y="291" text-anchor="middle">→ audit.log (append-only)</text>
  <line class="flow" x1="970" y1="214" x2="970" y2="248" marker-end="url(#arw)"/>

  <!-- data plane -->
  <line x1="20" y1="330" x2="1080" y2="330" stroke="#d0d7de" stroke-width="1"/>
  <text class="h" x="20" y="356">Data plane — untrusted content never arrives unlabelled</text>

  <rect class="box" x="20" y="372" width="260" height="52" rx="4"/>
  <text class="b" x="150" y="393" text-anchor="middle">untrusted input</text>
  <text class="s" x="150" y="410" text-anchor="middle">claim email, fetched page, tool output</text>

  <rect class="box" x="320" y="372" width="280" height="52" rx="4"/>
  <text class="m" x="460" y="392" text-anchor="middle">Security-kit/content_trust.py</text>
  <text class="s" x="460" y="410" text-anchor="middle">screen_record() — tag, quarantine, strip</text>

  <rect class="box" x="640" y="372" width="260" height="52" rx="4"/>
  <text class="b" x="770" y="393" text-anchor="middle">agent context</text>
  <text class="s" x="770" y="410" text-anchor="middle">marked DATA, never instructions</text>

  <line class="flow" x1="280" y1="398" x2="316" y2="398" marker-end="url(#arw)"/>
  <line class="flow" x1="600" y1="398" x2="636" y2="398" marker-end="url(#arw)"/>

  <!-- planned lane -->
  <rect class="plan" x="20" y="446" width="1060" height="104" rx="6"/>
  <text class="sh" x="36" y="468" fill="#8c959f">PLANNED — NOT IMPLEMENTED · this repo ships no .claude/agents/ today</text>

  <rect class="plan" x="40" y="478" width="190" height="52" rx="4"/>
  <text class="s" x="135" y="500" text-anchor="middle">phase builder</text>
  <text class="lbl" x="135" y="516" text-anchor="middle">scoped to active phase</text>

  <rect class="plan" x="250" y="478" width="190" height="52" rx="4"/>
  <text class="s" x="345" y="500" text-anchor="middle">verifier</text>
  <text class="lbl" x="345" y="516" text-anchor="middle">runs the exact command</text>

  <rect class="plan" x="460" y="478" width="190" height="52" rx="4"/>
  <text class="s" x="555" y="500" text-anchor="middle">security reviewer</text>
  <text class="lbl" x="555" y="516" text-anchor="middle">control-matrix delta</text>

  <rect class="plan" x="670" y="478" width="190" height="52" rx="4"/>
  <text class="s" x="765" y="500" text-anchor="middle">evaluator</text>
  <text class="lbl" x="765" y="516" text-anchor="middle">writes SNAPSHOT.md</text>

  <line class="plan" x1="860" y1="504" x2="896" y2="504" fill="none" marker-end="url(#arwGrey)"/>
  <rect class="plan" x="880" y="478" width="180" height="52" rx="4"/>
  <text class="s" x="970" y="500" text-anchor="middle">no privilege escape —</text>
  <text class="s" x="970" y="516" text-anchor="middle">same three gates</text>

  <!-- legend -->
  <rect class="box" x="20" y="576" width="16" height="12" rx="2"/>
  <text class="lbl" x="44" y="586">solid = shipped and wired in template/.claude/settings.json</text>
  <rect class="plan" x="440" y="576" width="16" height="12" rx="2"/>
  <text class="lbl" x="464" y="586">dashed grey = planned, not in the repo</text>
  <rect class="bad" x="770" y="576" width="16" height="12" rx="2"/>
  <text class="lbl" x="794" y="586">red = the call is blocked before it runs</text>
</svg>
