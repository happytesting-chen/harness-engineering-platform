<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d">
  <title id="t">Where this harness sits in the SDLC: inside Development, after Design and Plan, before Pre-deployment</title>
  <desc id="d">Five SDLC stages run left to right: Requirements, Design and Plan, Development (expanded and highlighted), Pre-deployment review, and Deploy and Operate. Inside Development: copy the template, fill Context/, then a phase loop of build, verify and human sign-off, producing evidence. Design and Plan feeds product and architecture docs into Context/. Development hands the audit log, evaluation snapshot and control coverage out to Pre-deployment review.</desc>

  <rect width="1100" height="470" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h   { font-size: 16px; font-weight: 700; }
    .st  { font-size: 13px; font-weight: 700; fill: #57606a; }
    .sta { font-size: 15px; font-weight: 700; fill: #0969da; }
    .b   { font-size: 12.5px; font-weight: 700; }
    .s   { font-size: 11px; fill: #57606a; }
    .m   { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .ann { font-size: 11px; font-weight: 700; fill: #0969da; }
    .stage  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .active { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .card  { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .loop  { fill: #ffffff; stroke: #1a7f37; stroke-width: 1.4; }
    .flow  { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .hand  { stroke: #0969da; stroke-width: 2; fill: none; }
  </style>

  <text class="h" x="20" y="30">This is a build-time harness. It runs inside Development — after the design is settled, before anything ships.</text>

  <!-- stage ribbon -->
  <rect class="stage" x="20" y="56" width="150" height="48" rx="4"/>
  <text class="st" x="95" y="86" text-anchor="middle">Requirements</text>

  <rect class="stage" x="182" y="56" width="150" height="48" rx="4"/>
  <text class="st" x="257" y="80" text-anchor="middle">Design &amp; Plan</text>
  <text class="s" x="257" y="95" text-anchor="middle">threat model, architecture</text>

  <rect class="active" x="344" y="56" width="412" height="48" rx="4"/>
  <text class="sta" x="550" y="79" text-anchor="middle">Development</text>
  <text class="s" x="550" y="95" text-anchor="middle">← this repo</text>

  <rect class="stage" x="768" y="56" width="150" height="48" rx="4"/>
  <text class="st" x="843" y="80" text-anchor="middle">Pre-deployment</text>
  <text class="s" x="843" y="95" text-anchor="middle">security review, sign-off</text>

  <rect class="stage" x="930" y="56" width="150" height="48" rx="4"/>
  <text class="st" x="1005" y="80" text-anchor="middle">Deploy &amp;</text>
  <text class="st" x="1005" y="96" text-anchor="middle">Operate</text>

  <line class="flow" x1="170" y1="80" x2="178" y2="80" marker-end="url(#a)"/>
  <line class="flow" x1="332" y1="80" x2="340" y2="80" marker-end="url(#a)"/>
  <line class="flow" x1="756" y1="80" x2="764" y2="80" marker-end="url(#a)"/>
  <line class="flow" x1="918" y1="80" x2="926" y2="80" marker-end="url(#a)"/>

  <!-- expansion connectors -->
  <line x1="344" y1="104" x2="200" y2="150" stroke="#0969da" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="756" y1="104" x2="900" y2="150" stroke="#0969da" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- expanded development panel -->
  <rect class="active" x="200" y="150" width="700" height="192" rx="6" fill="#f6fbff"/>
  <text class="b" x="220" y="174" fill="#0969da">Inside Development</text>

  <rect class="card" x="220" y="188" width="140" height="60" rx="4"/>
  <text class="b" x="290" y="209" text-anchor="middle">1. Copy</text>
  <text class="m" x="290" y="226" text-anchor="middle">cp -r template/</text>
  <text class="s" x="290" y="240" text-anchor="middle">harness skeleton</text>

  <rect class="card" x="378" y="188" width="150" height="60" rx="4"/>
  <text class="b" x="453" y="209" text-anchor="middle">2. Fill</text>
  <text class="m" x="453" y="226" text-anchor="middle">Context/ + policy JSON</text>
  <text class="s" x="453" y="240" text-anchor="middle">/init-project</text>

  <rect class="loop" x="546" y="188" width="180" height="60" rx="4"/>
  <text class="b" x="636" y="207" text-anchor="middle">3. Phase loop</text>
  <text class="s" x="636" y="223" text-anchor="middle">build → verify →</text>
  <text class="s" x="636" y="238" text-anchor="middle">human sign-off</text>

  <rect class="card" x="744" y="188" width="136" height="60" rx="4"/>
  <text class="b" x="812" y="209" text-anchor="middle">4. Evidence</text>
  <text class="s" x="812" y="226" text-anchor="middle">recorded per phase,</text>
  <text class="s" x="812" y="240" text-anchor="middle">not per claim</text>

  <line class="flow" x1="360" y1="218" x2="374" y2="218" marker-end="url(#a)"/>
  <line class="flow" x1="528" y1="218" x2="542" y2="218" marker-end="url(#a)"/>
  <line class="flow" x1="726" y1="218" x2="740" y2="218" marker-end="url(#a)"/>

  <!-- loop back arrow -->
  <path class="loop" d="M 636 248 L 636 266 L 453 266 L 453 250" marker-end="url(#a)" stroke="#1a7f37"/>
  <text class="s" x="545" y="281" text-anchor="middle" fill="#1a7f37">phase fails verification → stays active, never self-promoted</text>

  <text class="s" x="220" y="312">Every tool call in this box passes the three gates. The agent works one phase at a time (WIP = 1) and cannot mark its own work done.</text>
  <text class="s" x="220" y="330">What it is <tspan font-weight="700">not</tspan>: a runtime guardrail for a deployed agent, and not a replacement for pre-deployment review — it is what makes that review evidence-based.</text>

  <!-- handoff arrows -->
  <path class="hand" d="M 257 104 L 257 130 L 300 130 L 300 184" marker-end="url(#ab)"/>
  <text class="ann" x="20" y="378">IN from Design &amp; Plan</text>
  <text class="s" x="20" y="395">product spec, architecture,</text>
  <text class="s" x="20" y="410">AI stack, threat model</text>
  <text class="m" x="20" y="426">→ Context/ and Security-kit/</text>

  <path class="hand" d="M 850 248 L 960 248 L 960 372" marker-end="url(#ab)"/>
  <text class="ann" x="700" y="378">OUT to Pre-deployment review</text>
  <text class="s" x="700" y="395">audit.log — every tool call and verdict</text>
  <text class="s" x="700" y="410">evaluation SNAPSHOT.md — measured, not asserted</text>
  <text class="s" x="700" y="426">control-matrix.md — coverage per trust boundary</text>
  <text class="s" x="700" y="446" font-weight="700" fill="#0969da">This out-arrow is why a security reviewer cares.</text>
</svg>
