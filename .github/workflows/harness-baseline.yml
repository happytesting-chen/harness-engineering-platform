# Asserts the BASELINE declared in
# template/docs/superpowers/specs/2026-08-13-security-kit-build-design.md §7.4.1 —
# NOT that the build is green.
#
# The shipped template is red by design: 4 files still hold {{PLACEHOLDER}} blocks that
# /init-project fills, and Security-kit/coverage.json is absent until /security-tailor
# runs. So `./init.sh` exits 1 in a correct tree, and a workflow asserting exit 0 could
# never pass. This asserts the exact SHAPE of that failure instead, which is strictly
# stronger: a NEW error becomes a diff rather than an increment nobody notices.
#
# What is pinned, and what deliberately is NOT:
#   pinned      — exit code, error COUNT, and the exact set of ✗ error lines
#   not pinned  — the warning count. One of the two warnings is mtime-derived
#                 ("progress.md is older than recent code changes"), and git does not
#                 record mtimes: a fresh `actions/checkout` gives every file the same
#                 checkout time, so the comparison is undefined. Measured on a
#                 uniform-mtime tree, init.sh reports 1 warning; run it a second time
#                 and tests/test_e2e.py's save/restore of the three policy files has
#                 bumped their mtimes past progress.md, so it reports 2. A pinned
#                 warning count is therefore a coin flip, not a baseline.
name: harness baseline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: template init.sh matches the declared baseline (spec §7.4.1)
        working-directory: template
        run: |
          set +e
          OUT="$(./init.sh 2>&1)"; CODE=$?
          set -e
          echo "$OUT"

          if [ "$CODE" -ne 1 ]; then
            echo "::error::expected exit 1 (red by design), got $CODE — baseline drifted, see spec §7.4.1"
            exit 1
          fi

          if ! echo "$OUT" | grep -qE 'RESULT: FAIL — 5 error\(s\)'; then
            echo "::error::baseline drifted — expected 5 error(s), see spec §7.4.1 and re-measure §2"
            exit 1
          fi

          # The error SET, not just its size. 6 ✗ lines for 5 errors is correct: the
          # coverage checker prints its own "coverage.json missing" line from a child
          # process, and init.sh increments ERRORS once for the checker's non-zero exit.
          echo "$OUT" | grep '✗' | sed 's/^[[:space:]]*//' | sort > /tmp/actual-errors.txt
          # Both sides pass through the same leading-whitespace strip, so this block is
          # indentation-proof — `sed -i` is not portable and is not used.
          sed 's/^[[:space:]]*//' <<'EOF' | sort > /tmp/expected-errors.txt
          ✗ UNFILLED placeholders in CLAUDE.md:
          ✗ UNFILLED placeholders in Harness-Best-Practice/AGENTS.md:
          ✗ UNFILLED placeholders in Harness-Best-Practice/feature_list.json:
          ✗ UNFILLED placeholders in governance/mcp-allowlist.json:
          ✗ coverage.json missing — run /security-tailor (fail-closed)
          ✗ security coverage incomplete — run /security-tailor and fill verifications
          EOF
          if ! diff -u /tmp/expected-errors.txt /tmp/actual-errors.txt; then
            echo "::error::the baseline ERROR SET changed (diff above). If this is intended, update spec §7.4.1 and this list together."
            exit 1
          fi

          echo "baseline OK: exit 1, 5 errors, error set unchanged"

      - name: install pytest (a CI tool, not a mechanism dependency)
        # AGENTS.md:8 — "zero external deps for mechanism code" — binds the kit, not the
        # runner. Nothing under governance/ or Security-kit/ imports pytest; every test file
        # keeps its stdlib __main__ runner. Pinned so a pytest release cannot move the gate.
        run: python3 -m pip install --quiet pytest==9.1.1

      - name: full suite under pytest (fatal)
        working-directory: template
        # init.sh names 21 of the 38 test files (SEC-PROOF-GAP-001). Until 2026-09-03 this
        # step was non-fatal when pytest was absent — and pytest WAS absent on every run, so
        # the 17 unnamed files (incl. 13 runtime suites) had never executed on GitHub while
        # the README said they did. The step above removes the excuse; this one fails.
        #
        # Spec §6.1 (build-design.md:462) already expects `pytest tests/ -q` here. pytest
        # collects test FUNCTIONS individually, so it also catches a test a file's own
        # __main__ runner forgets to call — the 2026-09-01 test_host.py defect.
        #
        # One test needs the operator's local classifier artifacts (700 MB, never on a
        # runner): tests/runtime/test_claims_truthfulness.py skips its artifact half with a
        # stated reason when the lock's paths are absent, and still checks the corpus digest.
        run: python3 -m pytest tests/ -q
